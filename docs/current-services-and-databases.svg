<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1020" viewBox="0 0 1500 1020" role="img" aria-labelledby="title desc" font-family="Segoe UI, Arial, sans-serif">
  <title id="title">LMS services and databases</title>
  <desc id="desc">Working tree on 26 November 2026. The gateway and five backend services use Eureka. Four gateway routes lead to auth, course, order and AI. Auth, course and order persist to PostgreSQL. Course also configures MongoDB. Order obtains lesson counts from course. AI and notification have application entry points only.</desc>
  <defs>
    <marker id="http" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L8 4L0 8Z" fill="#344f74"/></marker>
    <marker id="data" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L8 4L0 8Z" fill="#1f7963"/></marker>
    <marker id="call" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L8 4L0 8Z" fill="#a25428"/></marker>
  </defs>
  <rect width="1500" height="1020" fill="#f7f8f5"/>
  <g fill="#182e3b">
    <text x="44" y="62" font-size="42" font-weight="700">LMS services and databases</text>
    <text x="44" y="96" font-size="19" fill="#47606a">Spring Boot multi-module project · Gateway routes, internal HTTP calls and service-owned data</text>
    <text x="1456" y="60" text-anchor="end" font-size="16" font-weight="600">26 November 2026</text>
    <text x="1456" y="85" text-anchor="end" font-size="15" fill="#546771">Source snapshot · default ports</text>
  </g>

  <!-- Discovery runs independently of the request path. -->
  <g id="eureka-server">
    <rect x="44" y="129" width="1412" height="91" rx="10" fill="#e7edf5" stroke="#b9c8d8"/>
    <text x="64" y="152" fill="#435d79" font-size="13" font-weight="700" letter-spacing="1.5">SERVICE DISCOVERY</text>
    <text x="64" y="190" fill="#233d56" font-size="26" font-weight="700">eureka-server</text>
    <text x="252" y="189" fill="#435d79" font-size="18" font-family="Consolas, monospace">8761</text>
    <path d="M340 145V204" stroke="#b0c1d2"/>
    <text x="363" y="165" fill="#233d56" font-size="18" font-weight="600">The gateway and all five backends register and fetch the service registry.</text>
    <text x="363" y="194" fill="#405568" font-size="16">Gateway routes resolve service IDs through Eureka. The two internal HTTP clients use configurable base URLs.</text>
  </g>

  <g font-size="14" font-weight="700" fill="#4a606c" letter-spacing="1.3">
    <text x="44" y="261">CLIENT AND GATEWAY</text><text x="565" y="261">BACKEND SERVICES</text><text x="1070" y="261">PERSISTENCE</text>
  </g>
  <g stroke="#cbd4d5"><path d="M44 272H317 M565 272H952 M1070 272H1456"/></g>

  <!-- Gateway route bus and four Path predicates. -->
  <g fill="none" stroke="#344f74" stroke-width="2">
    <path d="M180 384V438" marker-end="url(#http)"/>
    <path d="M316 501H364 M364 337V785"/>
    <path d="M364 337H562 M364 475H562 M364 647H562 M364 785H562"/>
  </g>
  <g fill="#344f74"><path d="M553 333l9 4-9 4z M553 471l9 4-9 4z M553 643l9 4-9 4z M553 781l9 4-9 4z"/></g>
  <g font-family="Consolas, monospace" font-size="15" fill="#344f74">
    <text x="375" y="327">/api/v1/auth/**</text>
    <text x="375" y="465">/api/v1/courses/**</text>
    <text x="375" y="637">/api/v1/orders/**</text>
    <text x="375" y="775">/api/v1/ai/**</text>
  </g>

  <g id="client">
    <rect x="44" y="301" width="272" height="82" rx="8" fill="#fff" stroke="#bdc9ce"/>
    <text x="62" y="337" font-size="23" font-weight="700" fill="#233b4b">API client</text>
    <text x="62" y="362" font-size="16" fill="#4d636e">HTTP requests</text>
  </g>
  <g id="api-gateway">
    <rect x="44" y="441" width="272" height="191" rx="9" fill="#203b50"/>
    <text x="62" y="476" fill="#fff" font-size="23" font-weight="700">api-gateway</text>
    <text x="297" y="475" fill="#dae6ef" font-family="Consolas, monospace" font-size="17" text-anchor="end">8080</text>
    <text x="62" y="505" font-size="16" fill="#e2ebf1">Spring Cloud Gateway · WebFlux</text>
    <path d="M62 523H297" stroke="#5e7484"/>
    <text x="62" y="548" font-size="15" fill="#fff">Checks HTTP Basic credentials</text>
    <text x="62" y="569" font-size="15" fill="#fff">on protected requests via</text>
    <text x="62" y="591" font-size="15" fill="#fff" font-family="Consolas, monospace">GET /api/v1/auth/me</text>
    <text x="62" y="614" font-size="14" fill="#d6e5ed">Forwards user identity and roles.</text>
  </g>

  <!-- Local data paths, secondary configuration, and service-to-service call. -->
  <g fill="none" stroke="#1f7963" stroke-width="2">
    <path d="M951 337H1068" marker-end="url(#data)"/>
    <path d="M951 460H1068" marker-end="url(#data)"/>
    <path d="M951 647H1068" marker-end="url(#data)"/>
  </g>
  <path d="M951 504H990V549H1068" fill="none" stroke="#79858b" stroke-width="2" stroke-dasharray="5 5"/>
  <path d="M718 596V528" fill="none" stroke="#a25428" stroke-width="2" marker-end="url(#call)"/>
  <text x="732" y="554" font-size="15" font-weight="600" fill="#8a4823">GET lesson count</text>
  <text x="732" y="575" font-size="14" fill="#75523f">Used to calculate progress</text>

  <g fill="#fff" stroke="#b4c5cb">
    <rect x="565" y="292" width="386" height="94" rx="8"/>
    <rect x="565" y="419" width="386" height="107" rx="8"/>
    <rect x="565" y="597" width="386" height="107" rx="8"/>
    <rect x="565" y="742" width="386" height="88" rx="8"/>
    <rect x="565" y="856" width="386" height="88" rx="8"/>
  </g>
  <g fill="#213a49" font-size="23" font-weight="700">
    <text id="auth-service" x="584" y="326">auth-service</text>
    <text id="course-service" x="584" y="453">course-service</text>
    <text id="order-service" x="584" y="631">order-service</text>
    <text id="ai-service" x="584" y="775">ai-service</text>
    <text id="notification-service" x="584" y="890">notification-service</text>
  </g>
  <g fill="#446071" font-family="Consolas, monospace" font-size="17" text-anchor="end">
    <text x="932" y="326">8082</text><text x="932" y="453">8083</text><text x="932" y="631">8085</text>
    <text x="932" y="775">8081</text><text x="932" y="890">8084</text>
  </g>
  <g fill="#415863" font-size="16">
    <text x="584" y="352">Registration, login and current user</text><text x="584" y="373">BCrypt passwords · roles</text>
    <text x="584" y="480">Public catalog reads</text><text x="584" y="502">Instructor and admin catalog writes</text>
    <text x="584" y="658">Enrollments and lesson completion</text><text x="584" y="681">Per-learner course progress</text>
    <text x="584" y="806">MVC application entry point only</text>
    <text x="584" y="919">Discovery client only · no gateway route</text>
  </g>

  <!-- PostgreSQL table names come from the JPA mappings and their join table. -->
  <g fill="#e8f3ed" stroke="#a7c6b6">
    <rect x="1070" y="292" width="386" height="107" rx="8"/>
    <rect x="1070" y="419" width="386" height="90" rx="8"/>
    <rect x="1070" y="597" width="386" height="107" rx="8"/>
  </g>
  <g fill="#21614c" font-size="14" font-weight="700">
    <text x="1088" y="315">POSTGRESQL</text><text x="1088" y="442">POSTGRESQL</text><text x="1088" y="620">POSTGRESQL</text>
  </g>
  <g fill="#173e32" font-size="22" font-weight="700">
    <text x="1088" y="341">auth_db</text><text x="1088" y="468">course_db</text><text x="1088" y="647">order_db</text>
  </g>
  <g fill="#365449" font-size="15" font-family="Consolas, monospace">
    <text x="1088" y="365">users, roles, user_roles,</text><text x="1088" y="385">profiles, trainees, instructors</text>
    <text x="1088" y="486">categories, courses,</text><text x="1088" y="503">course_modules, lessons</text>
    <text x="1088" y="676">enrollments, lesson_progress</text>
  </g>
  <g fill="#fcfcf9" stroke="#aab5b5" stroke-dasharray="5 4">
    <rect x="1070" y="523" width="386" height="56" rx="7"/>
    <rect x="1070" y="742" width="386" height="88" rx="7"/>
  </g>
  <g fill="#455760">
    <text x="1088" y="545" font-size="16" font-weight="700">MongoDB · course_db</text>
    <text x="1088" y="566" font-size="15">Configured client · no mapped collections</text>
    <text x="1088" y="772" font-size="17" font-weight="700">ai_db · properties only</text>
    <text x="1088" y="797" font-size="15">The AI module has no PostgreSQL driver</text>
    <text x="1088" y="818" font-size="15">or JPA repositories.</text>
  </g>
  <path d="M44 962H1456" stroke="#c3cecd"/>
  <g font-size="15" fill="#3d5560">
    <path d="M46 989H85" stroke="#344f74" stroke-width="2" marker-end="url(#http)"/><text x="96" y="994">Gateway traffic</text>
    <path d="M282 989H321" stroke="#a25428" stroke-width="2" marker-end="url(#call)"/><text x="332" y="994">Internal HTTP call</text>
    <path d="M563 989H602" stroke="#1f7963" stroke-width="2" marker-end="url(#data)"/><text x="613" y="994">JPA / PostgreSQL</text>
    <path d="M854 989H893" stroke="#79858b" stroke-width="2" stroke-dasharray="5 5"/><text x="904" y="994">Configuration only</text>
  </g>
</svg>
