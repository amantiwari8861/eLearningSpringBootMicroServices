<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1180" viewBox="0 0 1500 1180" role="img" aria-labelledby="title desc" font-family="Segoe UI, Arial, sans-serif">
  <title id="title">LMS request and learning flow</title>
  <desc id="desc">Client requests reach the gateway. Public paths bypass Basic validation; protected requests are checked against auth-service, receive injected identity headers, then reach role-gated auth, course or order handlers before returning an HTTP response.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L9 4.5L0 9Z" fill="#344f74"/></marker>
    <marker id="errorArrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L9 4.5L0 9Z" fill="#b23a3a"/></marker>
    <marker id="okArrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L9 4.5L0 9Z" fill="#1f7963"/></marker>
    <style>
      .heading { font-size: 40px; font-weight: 700; fill: #182e3b; }
      .subheading { font-size: 18px; fill: #47606a; }
      .date { font-size: 16px; font-weight: 600; fill: #546771; }
      .box { fill: #ffffff; stroke: #b4c5cb; stroke-width: 1.6; }
      .dark { fill: #203b50; stroke: #163044; stroke-width: 1.6; }
      .decision { fill: #fff4dc; stroke: #c3912d; stroke-width: 1.8; }
      .error { fill: #fdecec; stroke: #b23a3a; stroke-width: 1.8; }
      .ok { fill: #e7f3ee; stroke: #1f7963; stroke-width: 1.8; }
      .flow { fill: none; stroke: #344f74; stroke-width: 2; }
      .errorFlow { fill: none; stroke: #b23a3a; stroke-width: 2; }
      .okFlow { fill: none; stroke: #1f7963; stroke-width: 2; }
      .label { font-size: 15px; font-weight: 600; fill: #405568; }
      .small { font-size: 13px; fill: #546771; }
      .body { font-size: 16px; fill: #233b4b; }
      .bodyLight { font-size: 15px; fill: #e2ebf1; }
      .mono { font-family: Consolas, monospace; font-size: 13px; fill: #344f74; }
      .monoLight { font-family: Consolas, monospace; font-size: 13px; fill: #d6e5ed; }
    </style>
  </defs>

  <rect width="1500" height="1180" fill="#f7f8f5"/>
  <g>
    <text x="44" y="62" class="heading">LMS request and learning flow</text>
    <text x="44" y="96" class="subheading">Implemented HTTP paths · public reads, Basic identity validation and role-gated writes</text>
    <text x="1456" y="60" text-anchor="end" class="date">26 November 2026</text>
    <text x="1456" y="86" text-anchor="end" class="small">Gateway entry point · default port 8080</text>
  </g>

  <!-- Entry and first decision -->
  <g id="entry">
    <rect x="40" y="170" width="220" height="80" rx="9" class="box"/>
    <text x="150" y="207" text-anchor="middle" font-size="22" font-weight="700" fill="#233b4b">API client</text>
    <text x="150" y="232" text-anchor="middle" class="small">HTTP request</text>

    <rect x="330" y="160" width="280" height="100" rx="9" class="dark"/>
    <text x="354" y="195" font-size="22" font-weight="700" fill="#ffffff">api-gateway</text>
    <text x="586" y="194" text-anchor="end" class="monoLight">8080</text>
    <text x="354" y="222" class="bodyLight">Removes client-supplied identity headers.</text>
    <text x="354" y="245" class="bodyLight">Applies one identity policy to every route.</text>

    <path d="M260 210H322" class="flow" marker-end="url(#arrow)"/>
    <path d="M610 210H642" class="flow" marker-end="url(#arrow)"/>

    <path d="M810 155L970 210L810 265L650 210Z" class="decision"/>
    <text x="810" y="205" text-anchor="middle" font-size="17" font-weight="700" fill="#6b4a12">Public path?</text>
    <text x="810" y="226" text-anchor="middle" class="small">register · login · course GET · actuator</text>
  </g>

  <!-- Public branch -->
  <g id="public-branch">
    <path d="M650 210H230V322" class="okFlow" marker-end="url(#okArrow)"/>
    <text x="300" y="198" class="label">Yes</text>

    <rect x="60" y="330" width="360" height="110" rx="9" class="ok"/>
    <text x="80" y="361" font-size="19" font-weight="700" fill="#175b48">Strip credentials and identity headers</text>
    <text x="80" y="388" class="body">No Basic validation and no X-User-* headers</text>
    <text x="80" y="414" class="small">The gateway does not call auth-service for these paths.</text>

    <path d="M240 440V482" class="okFlow" marker-end="url(#okArrow)"/>
    <rect x="60" y="490" width="360" height="110" rx="9" class="box"/>
    <text x="80" y="521" font-size="19" font-weight="700" fill="#233b4b">Route to the public handler</text>
    <text x="80" y="548" class="mono">POST /api/v1/auth/register</text>
    <text x="80" y="569" class="mono">POST /api/v1/auth/login</text>
    <text x="80" y="590" class="mono">GET /api/v1/courses/** · /actuator/**</text>

    <path d="M240 600V942" class="okFlow" marker-end="url(#okArrow)"/>
    <rect x="60" y="950" width="340" height="100" rx="9" class="ok"/>
    <text x="80" y="981" font-size="19" font-weight="700" fill="#175b48">Public handler runs</text>
    <text x="80" y="1008" class="body">Course reads stay open downstream.</text>
    <text x="80" y="1032" class="small">Write handlers are never public.</text>
  </g>

  <!-- Protected validation branch -->
  <g id="protected-validation">
    <path d="M810 265V302" class="flow" marker-end="url(#arrow)"/>
    <text x="836" y="288" class="label">No</text>

    <path d="M810 305L960 365L810 425L660 365Z" class="decision"/>
    <text x="810" y="360" text-anchor="middle" font-size="17" font-weight="700" fill="#6b4a12">Basic header present?</text>
    <text x="810" y="381" text-anchor="middle" class="small">Required for every non-public path</text>

    <path d="M960 365H1232" class="errorFlow" marker-end="url(#errorArrow)"/>
    <text x="1065" y="350" class="label" fill="#9c2f2f">No</text>
    <rect x="1240" y="325" width="200" height="80" rx="9" class="error"/>
    <text x="1340" y="358" text-anchor="middle" font-size="20" font-weight="700" fill="#9c2f2f">401</text>
    <text x="1340" y="384" text-anchor="middle" class="small">Unauthorized</text>

    <path d="M810 425V460" class="flow" marker-end="url(#arrow)"/>
    <text x="836" y="447" class="label">Yes</text>
    <rect x="640" y="460" width="340" height="100" rx="9" class="dark"/>
    <text x="660" y="492" font-size="18" font-weight="700" fill="#ffffff">Gateway validates credentials</text>
    <text x="660" y="518" class="monoLight">GET /api/v1/auth/me</text>
    <text x="660" y="542" class="small" fill="#d6e5ed">Auth-service eager-fetches roles.</text>

    <path d="M810 560V602" class="flow" marker-end="url(#arrow)"/>
    <path d="M810 605L980 665L810 725L640 665Z" class="decision"/>
    <text x="810" y="660" text-anchor="middle" font-size="17" font-weight="700" fill="#6b4a12">Usable identity?</text>
    <text x="810" y="681" text-anchor="middle" class="small">enabled · id · email</text>

    <path d="M980 665H1180V405H1232" class="errorFlow" marker-end="url(#errorArrow)"/>
    <text x="1095" y="650" class="label" fill="#9c2f2f">No</text>

    <path d="M810 725V762" class="flow" marker-end="url(#arrow)"/>
    <text x="836" y="748" class="label">Yes</text>
    <rect x="620" y="770" width="380" height="100" rx="9" class="ok"/>
    <text x="640" y="801" font-size="18" font-weight="700" fill="#175b48">Inject identity headers</text>
    <text x="640" y="827" class="mono">X-User-Id · X-User-Email · X-User-Roles</text>
    <text x="640" y="851" class="small">Basic is removed from non-auth routes.</text>
  </g>

  <!-- Protected routing and role checks -->
  <g id="protected-routing">
    <path d="M810 870V902" class="flow"/>
    <path d="M590 902H1305" class="flow"/>
    <path d="M590 902V942" class="flow" marker-end="url(#arrow)"/>
    <path d="M955 902V942" class="flow" marker-end="url(#arrow)"/>
    <path d="M1305 902V942" class="flow" marker-end="url(#arrow)"/>

    <rect x="440" y="950" width="300" height="100" rx="9" class="box"/>
    <text x="460" y="981" font-size="18" font-weight="700" fill="#233b4b">Auth /me</text>
    <text x="460" y="1008" class="body">Any validated user</text>
    <text x="460" y="1032" class="small">Basic is preserved on auth routes.</text>

    <rect x="790" y="950" width="330" height="100" rx="9" class="box"/>
    <text x="810" y="981" font-size="18" font-weight="700" fill="#233b4b">Course writes</text>
    <text x="810" y="1008" class="body">INSTRUCTOR or ADMIN only</text>
    <text x="810" y="1032" class="small">Roles come from X-User-Roles.</text>

    <rect x="1170" y="950" width="270" height="100" rx="9" class="box"/>
    <text x="1190" y="981" font-size="18" font-weight="700" fill="#233b4b">Orders</text>
    <text x="1190" y="1008" class="body">TRAINEE owns the record</text>
    <text x="1190" y="1032" class="small">Progress uses course lesson count.</text>
  </g>

  <!-- Shared response -->
  <g id="response">
    <path d="M230 1050V1082" class="okFlow" marker-end="url(#okArrow)"/>
    <path d="M590 1050V1082" class="flow" marker-end="url(#arrow)"/>
    <path d="M955 1050V1082" class="flow" marker-end="url(#arrow)"/>
    <path d="M1305 1050V1082" class="flow" marker-end="url(#arrow)"/>
    <rect x="60" y="1090" width="1380" height="60" rx="9" class="dark"/>
    <text x="750" y="1128" text-anchor="middle" font-size="20" font-weight="700" fill="#ffffff">HTTP response · status and JSON where applicable</text>
    <text x="44" y="1170" class="small">Client-supplied identity headers are always removed. AI and notification routes have no application handlers.</text>
  </g>
</svg>
