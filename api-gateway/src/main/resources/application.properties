# ==============================
# Application Configuration
# ==============================
spring.application.name=api-gateway
server.port=${SERVER_PORT:8080}
spring.main.web-application-type=reactive

# ==============================
# Eureka Client Configuration
# ==============================
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.service-url.defaultZone=${EUREKA_SERVER_URL:http://localhost:8761/eureka/}

# ==============================
# Eureka Instance Configuration
# ==============================
eureka.instance.prefer-ip-address=true
eureka.instance.instance-id=${spring.application.name}:${random.uuid}

# ==============================
# Gateway Configuration
# ==============================
spring.cloud.gateway.server.webflux.enabled=true
spring.cloud.gateway.server.webflux.discovery.locator.enabled=false


# ==============================
# HTTP Client Configuration
# ==============================
spring.cloud.gateway.server.webflux.httpclient.connect-timeout=5000
spring.cloud.gateway.server.webflux.httpclient.response-timeout=30s

# ==============================
# Browser CORS
# ==============================
# A CorsWebFilter answers preflights before the gateway identity filter runs.
# Explicit origins are required because credentialed requests cannot use a wildcard.
lms.cors.allowed-origins=${LMS_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000,http://localhost:5173,http://127.0.0.1:5173}

# ==============================
# Gateway identity validation
# ==============================
# The gateway validates Basic credentials with auth-service before forwarding
# identity headers to downstream services. Override with AUTH_SERVICE_URL.
lms.auth-service-url=${AUTH_SERVICE_URL:http://localhost:8082}

# ==============================
# Auth Service
# ==============================
spring.cloud.gateway.server.webflux.routes[0].id=auth-service
spring.cloud.gateway.server.webflux.routes[0].uri=lb://AUTH-SERVICE
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/v1/auth/**

# ==============================
# Course Service
# ==============================
spring.cloud.gateway.server.webflux.routes[1].id=course-service
spring.cloud.gateway.server.webflux.routes[1].uri=lb://COURSE-SERVICE
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/v1/courses/**

# ==============================
# Order Service
# ==============================
spring.cloud.gateway.server.webflux.routes[2].id=order-service
spring.cloud.gateway.server.webflux.routes[2].uri=lb://ORDER-SERVICE
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/api/v1/orders/**

# ==============================
# AI Service
# ==============================
spring.cloud.gateway.server.webflux.routes[3].id=ai-service
spring.cloud.gateway.server.webflux.routes[3].uri=lb://AI-SERVICE
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/api/v1/ai/**

# ==============================
# Actuator Configuration
# ==============================
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=never

# ==============================
# Micrometer Configuration
# ==============================
management.metrics.tags.application=${spring.application.name}